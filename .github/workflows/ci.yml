name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formatting (fix with `uv run ruff format .`)
        run: uv run ruff format --check .
      - name: Types
        run: uv run pyright
      - name: Tests
        run: uv run pytest -q
